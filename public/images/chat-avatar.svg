<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Illustrated admissions assistant for the website chat: flat vector, no photo -->
  <defs>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <!-- backdrop -->
    <rect width="120" height="120" fill="#f3d9c6"/>
    <circle cx="60" cy="60" r="60" fill="#f7e1d2"/>
    <!-- shoulders / navy uniform -->
    <path d="M12 128c0-26 20-40 48-40s48 14 48 40z" fill="#1c2a44"/>
    <!-- collar lapels -->
    <path d="M60 88 48 98 50 118h20l2-20z" fill="#2b3d5e"/>
    <!-- red neck scarf -->
    <path d="M60 86c-6 4-11 9-13 15l13-6 13 6c-2-6-7-11-13-15z" fill="#b8232f"/>
    <path d="M60 95 55 112h10z" fill="#9f1d28"/>
    <!-- wing badge -->
    <path d="M78 104h8l-2-3h-6zm-2-1h-6l-2 3h8z" fill="#e9c46a"/>
    <!-- neck -->
    <path d="M51 70h18v18c0 5-18 5-18 0z" fill="#d9a07f"/>
    <!-- hair back -->
    <path d="M34 50c0-18 12-30 26-30s26 12 26 30v12H34z" fill="#2b1b14"/>
    <!-- face -->
    <ellipse cx="60" cy="55" rx="21" ry="24" fill="#e8b394"/>
    <!-- hair front / parting -->
    <path d="M39 48c2-14 10-22 21-22s19 8 21 22c-6-6-13-9-21-9s-15 3-21 9z" fill="#2b1b14"/>
    <!-- bun -->
    <circle cx="60" cy="24" r="9" fill="#2b1b14"/>
    <!-- ears -->
    <ellipse cx="39" cy="57" rx="3.5" ry="5" fill="#e8b394"/>
    <ellipse cx="81" cy="57" rx="3.5" ry="5" fill="#e8b394"/>
    <!-- brows -->
    <path d="M48 48c3-2 7-2 10 0M62 48c3-2 7-2 10 0" stroke="#2b1b14" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="52.5" cy="55" rx="2.4" ry="2.8" fill="#2b1b14"/>
    <ellipse cx="67.5" cy="55" rx="2.4" ry="2.8" fill="#2b1b14"/>
    <circle cx="53.3" cy="54" r="0.8" fill="#fff"/>
    <circle cx="68.3" cy="54" r="0.8" fill="#fff"/>
    <!-- nose -->
    <path d="M60 58v6" stroke="#cf9273" stroke-width="1.6" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M53 67c3 3.5 11 3.5 14 0" stroke="#b8232f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="47" cy="63" r="3" fill="#f3b8a2" opacity=".7"/>
    <circle cx="73" cy="63" r="3" fill="#f3b8a2" opacity=".7"/>
    <!-- earrings -->
    <circle cx="39" cy="63" r="1.3" fill="#e9c46a"/>
    <circle cx="81" cy="63" r="1.3" fill="#e9c46a"/>
  </g>
</svg>
